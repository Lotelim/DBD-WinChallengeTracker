<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBD Killer Perk Roulette</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:#0a0a0f;
    color:#d4d4dc;
    min-height:100vh;
    padding:20px;
    overflow-x:hidden;
}

body::before{
    content:'';
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 20%,rgba(139,127,184,.15),transparent 40%),
        radial-gradient(circle at 80% 70%,rgba(70,90,140,.15),transparent 40%);
    pointer-events:none;
}

.container{
    max-width:1400px;
    margin:auto;
    position:relative;
    z-index:2;
}

.header{
    position:relative;
    margin-bottom:30px;
}

h1{
    text-align:center;
    font-size:2.7rem;
    letter-spacing:4px;
    margin-bottom:15px;
    color:#f0f0ff;
}

.reset-btn{
    position:absolute;
    left:0;
    top:0;
}

button{
    border:none;
    border-radius:12px;
    padding:14px 28px;
    cursor:pointer;
    font-weight:700;
    transition:.25s;
}

button:hover{
    transform:translateY(-2px);
}

.reset-btn{
    background:#303040;
    color:white;
}

.killer-btn{
    background:linear-gradient(135deg,#4e6990,#6c87aa);
    color:white;
}

.spin-btn{
    background:linear-gradient(135deg,#6b5b95,#8b7fb8);
    color:white;
    font-size:1.3rem;
    padding:18px 55px;
}

.win-btn{
    background:linear-gradient(135deg,#4d8b58,#66aa72);
    color:white;
}

.lose-btn{
    background:linear-gradient(135deg,#924b4b,#ba6666);
    color:white;
}

.undo-btn {
      background:linear-gradient(135deg,#6f6f6f,#3f3f3f);
    color:white;
}

.perk-counter{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:30px;
}

.counter-item{
    background:rgba(40,40,55,.75);
    padding:20px 30px;
    border-radius:14px;
    text-align:center;
    border:2px solid rgba(255,255,255,.08);
}

.counter-number{
    display:block;
    font-size:2rem;
    font-weight:800;
    color:#b9a7ff;
}

.counter-label{
    font-size:.85rem;
    margin-top:5px;
    color:#b7b7c7;
}

.killer-section{
    background:rgba(35,35,50,.75);
    border-radius:16px;
    padding:25px;
    margin-bottom:30px;
    text-align:center;
}

.killer-display{
    font-size:1.6rem;
    color:#d4c2ff;
    margin-bottom:15px;
    min-height:40px;
    font-weight:700;
}

.wheels-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.wheel{
    background:rgba(30,30,45,.75);
    border-radius:16px;
    padding:20px;
    border:2px solid rgba(255,255,255,.08);
    transition:.3s;
}

.wheel.spinning{
    border-color:#a98cff;
    box-shadow:0 0 30px rgba(169,140,255,.25);
}

.wheel-title{
    text-align:center;
    margin-bottom:15px;
    font-weight:700;
    color:#a8a8c2;
}

.perk-display{
    background:rgba(50,50,70,.6);
    border-radius:14px;
    min-height:150px;
    padding:20px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    border:2px solid rgba(255,255,255,.08);
}

.perk-display.spinning{
    animation:spinPulse .1s linear infinite;
}

.slot-actions{
    display:flex;
    justify-content:center;
    margin-top:12px;
}

@keyframes spinPulse{
    50%{
        transform:scale(1.02);
    }
}

.perk-name{
    font-size:1.2rem;
    font-weight:700;
    margin-bottom:10px;
    color:#f0f0ff;
}

.perk-killer{
    color:#b59cff;
    font-style:italic;
}

.spin-section{
    text-align:center;
    margin-bottom:25px;
}

.action-buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.notification{
    position:fixed;
    top:20px;
    right:20px;
    padding:15px 25px;
    border-radius:12px;
    color:white;
    z-index:9999;
    animation:slideIn .3s ease;
}

.notification.success{
    background:#4d8b58;
}

.notification.error{
    background:#924b4b;
}

.notification.info{
    background:#4e6990;
}

@keyframes slideIn{
    from{
        opacity:0;
        transform:translateX(300px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

@media(max-width:768px){

    h1{
        font-size:2rem;
    }

    .reset-btn{
        position:static;
        width:100%;
        margin-bottom:15px;
    }

    .spin-btn{
        width:100%;
    }
}
</style>
</head>

const KILLERS = [...new Set(ALL_PERKS.map(p=>p.killer))];

let availablePerks = [];
let currentPerks = [];
let isSpinning = false;

function init(){

    loadPerks();
    updateStats();

    spinBtn.onclick = spinAllPerks;
    winBtn.onclick = markAsWin;
    loseBtn.onclick = markAsLose;
    undoBtn.onclick = undoLastWin;
    resetBtn.onclick = resetAllPerks;
    spinKillerBtn.onclick = spinKiller;
}

function loadPerks(){

    const saved = localStorage.getItem('dbdAvailablePerks');

    try{

        if(saved){
            availablePerks = JSON.parse(saved);
        }else{
            availablePerks = [...ALL_PERKS];
            savePerks();
        }

    }catch{

        availablePerks = [...ALL_PERKS];
        savePerks();
    }
}

function savePerks(){
    localStorage.setItem(
        'dbdAvailablePerks',
        JSON.stringify(availablePerks)
    );
}

function updateStats(){

    totalPerks.textContent = ALL_PERKS.length;
    completedPerks.textContent =
        ALL_PERKS.length - availablePerks.length;
    remainingPerks.textContent = availablePerks.length;
}

function spinKiller(){

    spinKillerBtn.disabled = true;

    let count = 0;

    const interval = setInterval(()=>{

        killerDisplay.textContent =
            KILLERS[Math.floor(Math.random()*KILLERS.length)];

        count++;

        if(count >= 20){

            clearInterval(interval);

            spinKillerBtn.disabled = false;
        }

    },100);
}

function spinSingleSlot(slot){

    if(isSpinning) return;
    if(availablePerks.length === 0){
        showNotification('No perks remaining!', 'error');
        return;
    }

    isSpinning = true;

    const display = document.getElementById(`perk${slot}`);
    const wheel = display.closest('.wheel');

    display.classList.add('spinning');
    wheel.classList.add('spinning');

    let counter = 0;

    const interval = setInterval(() => {

        const random =
            availablePerks[Math.floor(Math.random() * availablePerks.length)];

        display.querySelector('.perk-name').textContent = random.name;
        display.querySelector('.perk-killer').textContent = random.killer;

        counter++;

        if(counter >= 25){

            clearInterval(interval);

            const finalPerk =
                availablePerks[Math.floor(Math.random() * availablePerks.length)];

            display.querySelector('.perk-name').textContent = finalPerk.name;
            display.querySelector('.perk-killer').textContent = finalPerk.killer;

            display.classList.remove('spinning');
            wheel.classList.remove('spinning');

            isSpinning = false;
        }

    }, 60);
}

function spinAllPerks(){

    if(isSpinning) return;

    if(availablePerks.length === 0){

        showNotification(
            'No perks remaining!',
            'error'
        );

        return;
    }

    isSpinning = true;
    spinBtn.disabled = true;

    const temp = [...availablePerks];
    const selected = [];

    const perkCount = Math.min(4,temp.length);

    for(let i=0;i<perkCount;i++){

        const index =
            Math.floor(Math.random()*temp.length);

        selected.push(temp[index]);
        temp.splice(index,1);
    }

    for(let i=1;i<=4;i++){

        const display =
            document.getElementById(`perk${i}`);

        display.classList.add('spinning');
        display.closest('.wheel')
            .classList.add('spinning');
    }

    let counter = 0;

    const interval = setInterval(()=>{

        for(let i=1;i<=4;i++){

            const random =
                availablePerks[
                    Math.floor(
                        Math.random()*availablePerks.length
                    )
                ];

            const display =
                document.getElementById(`perk${i}`);

            display.querySelector('.perk-name')
                .textContent = random.name;

            display.querySelector('.perk-killer')
                .textContent = random.killer;
        }

        counter++;

        if(counter >= 30){

            clearInterval(interval);

            currentPerks = [];

            for(let i=1;i<=4;i++){

                const display =
                    document.getElementById(`perk${i}`);

                const perk = selected[i-1];

                if(perk){

                    display.querySelector('.perk-name')
                        .textContent = perk.name;

                    display.querySelector('.perk-killer')
                        .textContent = perk.killer;

                    currentPerks.push(perk);

                }else{

                    display.querySelector('.perk-name')
                        .textContent = 'EMPTY';

                    display.querySelector('.perk-killer')
                        .textContent = '';
                }

                display.classList.remove('spinning');
                display.closest('.wheel')
                    .classList.remove('spinning');
            }

            isSpinning = false;
            spinBtn.disabled = false;
        }

    },80);
}

function markAsWin(){

    if(currentPerks.length === 0){
        showNotification('Spin first!', 'error');
        return;
    }

    // save last win before deleting (type shit safety)
    lastWinPerks = [...currentPerks];

    const ids = currentPerks.map(p => p.id);

    availablePerks = availablePerks.filter(
        p => !ids.includes(p.id)
    );

    savePerks();
    updateStats();
    clearCurrentPerks();

    showNotification('Perks removed!', 'success');
}

function undoLastWin(){

    if(lastWinPerks.length === 0){
        showNotification('Nothing to undo', 'error');
        return;
    }

    // restore perks back into pool
    for(const perk of lastWinPerks){

        const exists = availablePerks.find(p => p.id === perk.id);

        if(!exists){
            availablePerks.push(perk);
        }
    }

    savePerks();
    updateStats();

    showNotification('Last win restored!', 'info');

    lastWinPerks = [];
}

function markAsLose(){

    if(currentPerks.length === 0){

        showNotification(
            'Spin first!',
            'error'
        );

        return;
    }

    clearCurrentPerks();

    showNotification(
        'Try again!',
        'info'
    );
}

function clearCurrentPerks(){

    currentPerks = [];

    for(let i=1;i<=4;i++){

        const display =
            document.getElementById(`perk${i}`);

        display.querySelector('.perk-name')
            .textContent = '???';

        display.querySelector('.perk-killer')
            .textContent = '';
    }
}

function resetAllPerks(){

    if(!confirm('Reset all perks?'))
        return;

    availablePerks = [...ALL_PERKS];

    savePerks();
    updateStats();
    clearCurrentPerks();

    showNotification(
        'Reset complete!',
        'success'
    );
}

function showNotification(message,type='success'){

    const existing =
        document.querySelector('.notification');

    if(existing)
        existing.remove();

    const div =
        document.createElement('div');

    div.className = `notification ${type}`;
    div.textContent = message;

    document.body.appendChild(div);

    setTimeout(()=>{
        div.remove();
    },3000);
}

init();

</script>
