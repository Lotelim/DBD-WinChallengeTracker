<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBD Match Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0B1020;
            --bg-secondary: #11182D;
            --card-bg: rgba(18, 24, 43, 0.85);
            --card-border: rgba(255,255,255,0.08);
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            --accent: #8B5CF6;
            --accent-2: #6366F1;
            --success: #22C55E;
            --danger: #EF4444;
            --hover: rgba(255,255,255,0.04);
            --shadow: 0 20px 60px rgba(0,0,0,0.45);
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            background:
                radial-gradient(circle at top left, rgba(139, 92, 246, 0.25), transparent 30%),
                radial-gradient(circle at bottom right, rgba(99, 102, 241, 0.25), transparent 30%),
                linear-gradient(135deg, #070B16 0%, #0B1020 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            overflow-x: hidden;
        }

        .main-container {
            width: 100%;
            max-width: 1450px;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
            align-items: stretch;
        }

        .panel {
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            box-shadow: var(--shadow);
        }

        .left-panel {
            padding: 32px;
            position: sticky;
            top: 24px;
            height: fit-content;
        }

        .logo {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(139,92,246,0.4);
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 32px;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 12px;
            letter-spacing: 1px;
            font-weight: 700;
            text-transform: uppercase;
            color: #D1D5DB;
        }

        select {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: 0.25s ease;
        }

        select:hover {
            background: rgba(255,255,255,0.05);
        }

        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(139,92,246,0.15);
        }

        select option {
            background: #111827;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: white;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.25s ease;
            margin-top: 12px;
            box-shadow: 0 12px 30px rgba(99,102,241,0.35);
        }

        .submit-btn:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 16px 40px rgba(99,102,241,0.45);
        }

        .right-panel {
            padding: 32px;
            display: flex;
            flex-direction: column;
            min-height: 820px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px;
        }

        .top-bar-left h2 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .top-bar-left p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .clear-btn {
            border: 1px solid rgba(239,68,68,0.3);
            background: rgba(239,68,68,0.12);
            color: #FCA5A5;
            padding: 12px 16px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.25s ease;
            font-weight: 600;
        }

        .clear-btn:hover {
            background: rgba(239,68,68,0.22);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 22px;
            padding: 22px;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 999px;
            background: rgba(255,255,255,0.03);
            right: -40px;
            top: -40px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 10px;
            position: relative;
            z-index: 2;
        }

        .stat-value {
            font-size: 40px;
            font-weight: 800;
            position: relative;
            z-index: 2;
        }

        .wins {
            color: var(--success);
        }

        .losses {
            color: var(--danger);
        }

        .rate {
            color: #A78BFA;
        }

        .matches-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 6px;
        }

        .matches-container::-webkit-scrollbar {
            width: 8px;
        }

        .matches-container::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.12);
            border-radius: 999px;
        }

        .match-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 22px;
            padding: 18px;
            margin-bottom: 14px;
            transition: 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .match-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 5px;
            height: 100%;
        }

        .match-item.won::before {
            background: var(--success);
        }

        .match-item.lost::before {
            background: var(--danger);
        }

        .match-item:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,0.05);
        }

        .match-main {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 0;
        }

        .match-icon {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            background: rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .match-player {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .match-details {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .match-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-pill {
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-pill.won {
            background: rgba(34,197,94,0.15);
            color: #86EFAC;
        }

        .status-pill.lost {
            background: rgba(239,68,68,0.15);
            color: #FCA5A5;
        }

        .delete-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: 1px solid rgba(239,68,68,0.2);
            background: rgba(239,68,68,0.12);
            color: #FCA5A5;
            cursor: pointer;
            transition: 0.2s ease;
            font-size: 18px;
        }

        .delete-btn:hover {
            background: rgba(239,68,68,0.24);
            transform: scale(1.05);
        }

        .empty-state {
            height: 100%;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--text-secondary);
            gap: 14px;
        }

        .empty-state .emoji {
            font-size: 58px;
        }

        .empty-state h3 {
            font-size: 24px;
            color: white;
        }

        @media (max-width: 1100px) {
            .main-container {
                grid-template-columns: 1fr;
            }

            .left-panel {
                position: relative;
                top: unset;
            }
        }

        @media (max-width: 700px) {
            body {
                padding: 16px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .match-item {
                flex-direction: column;
                align-items: stretch;
            }

            .match-actions {
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>

<div class="main-container">

    <div class="left-panel panel">
        <div class="logo">🎮</div>

        <h1>DBD Match Tracker</h1>
        <p class="subtitle">
            Track your Dead by Daylight matches
        </p>

        <form id="matchForm">

            <div class="form-group">
                <label for="playerName">Player</label>
                <select id="playerName" required>
                    <option value="">Select player...</option>
                    <option value="Lotem">Lotem</option>
                    <option value="Tohar">Tohar</option>
                </select>
            </div>

            <div class="form-group">
                <label for="killer">Killer</label>
                <select id="killer" required></select>
            </div>

            <div class="form-group">
                <label for="status">Result</label>
                <select id="status" required>
                    <option value="">Select result...</option>
                    <option value="won">Won</option>
                    <option value="lost">Lost</option>
                </select>
            </div>

            <button class="submit-btn" type="submit">
                Add Match
            </button>

        </form>
    </div>

    <div class="right-panel panel">

        <div class="top-bar">
            <div class="top-bar-left">
                <h2>Match History</h2>
                <p>All your tracked games in one place.</p>
            </div>

            <button class="clear-btn" id="clearBtn">
                Clear All
            </button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Wins</div>
                <div class="stat-value wins" id="winsCount">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Losses</div>
                <div class="stat-value losses" id="lossesCount">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Win Rate</div>
                <div class="stat-value rate" id="winRate">0%</div>
            </div>
        </div>

        <div class="matches-container" id="matchesList"></div>

    </div>

</div>

<script>

    let matches = JSON.parse(localStorage.getItem('dbdMatches')) || [];
    let wonKillers = JSON.parse(localStorage.getItem('wonKillers')) || [];

    const allKillers = [
        "The Trapper",
        "The Wraith",
        "The Hillbilly",
        "The Nurse",
        "The Shape",
        "The Hag",
        "The Doctor",
        "The Huntress",
        "The Cannibal",
        "The Nightmare",
        "The Pig",
        "The Clown",
        "The Spirit",
        "The Legion",
        "The Plague",
        "The Ghost Face",
        "The Demogorgon",
        "The Oni",
        "The Deathslinger",
        "The Executioner",
        "The Blight",
        "The Twins",
        "The Trickster",
        "The Nemesis",
        "The Cenobite",
        "The Artist",
        "The Onryō",
        "The Dredge",
        "The Mastermind",
        "The Knight",
        "The Skull Merchant",
        "The Xenomorph",
        "The Good Guy",
        "The Unknown",
        "The Houndmaster",
        "The Animatronic"
    ];

    function updateKillerDropdown() {
        const killerSelect = document.getElementById('killer');
        const currentValue = killerSelect.value;

        killerSelect.innerHTML = '<option value="">Select killer...</option>';

        allKillers.forEach(killer => {
            const option = document.createElement('option');
            option.value = killer;

            if (wonKillers.includes(killer)) {
                option.textContent = `${killer} ✓`;
                option.disabled = true;
            }
            else {
                option.textContent = killer;
            }

            killerSelect.appendChild(option);
        });

        killerSelect.value = currentValue;
    }

    function renderMatches() {

        const matchesList = document.getElementById('matchesList');

        const wins = matches.filter(m => m.status === 'won').length;
        const losses = matches.filter(m => m.status === 'lost').length;
        const total = matches.length;

        const rate = total > 0
            ? Math.round((wins / total) * 100)
            : 0;

        document.getElementById('winsCount').textContent = wins;
        document.getElementById('lossesCount').textContent = losses;
        document.getElementById('winRate').textContent = `${rate}%`;

        if (matches.length === 0) {
            matchesList.innerHTML = `
                <div class="empty-state">
                    <div class="emoji">🩸</div>
                    <h3>No matches tracked</h3>
                    <p>Your history is emptier than solo queue teamwork.</p>
                </div>
            `;
            return;
        }

        matchesList.innerHTML = [...matches]
            .reverse()
            .map(match => `
                <div class="match-item ${match.status}">

                    <div class="match-main">
                        <div class="match-icon">
                            ${match.status === 'won' ? '🏆' : '💀'}
                        </div>

                        <div>
                            <div class="match-player">${match.player}</div>
                            <div class="match-details">Played as ${match.killer}</div>
                        </div>
                    </div>

                    <div class="match-actions">
                        <div class="status-pill ${match.status}">
                            ${match.status}
                        </div>

                        <button
                            class="delete-btn"
                            onclick="deleteMatch('${match.timestamp}')"
                        >
                            ✕
                        </button>
                    </div>

                </div>
            `)
            .join('');
    }

    function deleteMatch(timestamp) {

        const matchIndex = matches.findIndex(
            match => match.timestamp === timestamp
        );

        if (matchIndex === -1)
            return;

        const deletedMatch = matches[matchIndex];

        if (deletedMatch.status === 'won') {
            wonKillers = wonKillers.filter(
                killer => killer !== deletedMatch.killer
            );

            localStorage.setItem(
                'wonKillers',
                JSON.stringify(wonKillers)
            );

            updateKillerDropdown();
        }

        matches.splice(matchIndex, 1);

        localStorage.setItem(
            'dbdMatches',
            JSON.stringify(matches)
        );

        renderMatches();
    }

    document
        .getElementById('matchForm')
        .addEventListener('submit', event => {

            event.preventDefault();

            const player = document.getElementById('playerName').value;
            const killer = document.getElementById('killer').value;
            const status = document.getElementById('status').value;

            matches.push({
                player,
                killer,
                status,
                timestamp: new Date().toISOString()
            });

            if (
                status === 'won' &&
                !wonKillers.includes(killer)
            ) {
                wonKillers.push(killer);

                localStorage.setItem(
                    'wonKillers',
                    JSON.stringify(wonKillers)
                );

                updateKillerDropdown();
            }

            localStorage.setItem(
                'dbdMatches',
                JSON.stringify(matches)
            );

            event.target.reset();

            renderMatches();
        });

    document
        .getElementById('clearBtn')
        .addEventListener('click', () => {

            const confirmed = confirm(
                'Clear all match history and reset won killers?'
            );

            if (!confirmed)
                return;

            matches = [];
            wonKillers = [];

            localStorage.setItem(
                'dbdMatches',
                JSON.stringify(matches)
            );

            localStorage.setItem(
                'wonKillers',
                JSON.stringify(wonKillers)
            );

            updateKillerDropdown();
            renderMatches();
        });

    updateKillerDropdown();
    renderMatches();

</script>

</body>
</html>
